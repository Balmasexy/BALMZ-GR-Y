name: HTML Proofer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  html-proofer:
    name: Run html-proofer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install html-proofer
        run: gem install html-proofer

      - name: Run html-proofer against ./public
        run: htmlproofer ./public --disable-external --allow-hash-href
